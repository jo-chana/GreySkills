<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Grey Skills · Mockup</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--navy:#0A2245;--ocean:#0077D4;--sky:#92C9EB;--stucco:#F5EBDC}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:#F4F6F9;color:#0A2245}
*,*::before,*::after{box-sizing:inherit}
img{max-width:100%}
.pv{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:#FFFFFF;border-bottom:1px solid #DDE3EA}
.pv-in{max-width:1200px;margin:0 auto;padding:8px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
.pv-t{font:700 14px "Helvetica Neue",Arial,sans-serif;color:#0A2245;margin-right:6px}
.pv-tabs{display:flex;flex-wrap:wrap;gap:6px}
.pv-tab{min-height:38px;padding:0 14px;border-radius:12px;border:1px solid #9AA6B5;background:#FFFFFF;color:#0A2245;font:700 14px "Helvetica Neue",Arial,sans-serif;cursor:pointer}
.pv-tab[aria-current="page"]{background:#0A2245;border-color:#0A2245;color:#FFFFFF}
.pv-tab:focus-visible{outline:3px solid #92C9EB;outline-offset:2px}
#root{min-height:calc(100vh - 56px)}
#root > div{min-height:calc(100vh - 56px)}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
.scr-Login{margin:0;background:#FFFFFF;color:#0A2245;font-family:Georgia,"Times New Roman",serif}
.scr-Login a{color:#0077D4}
.scr-Login a:hover{color:#0A2245}
.scr-Login .gs-input{box-sizing:border-box;width:100%;min-height:48px;padding:12px 14px;border:1px solid #9AA6B5;border-radius:12px;font:16px Georgia,serif;color:#0A2245;background:#fff}
.scr-Login .gs-input:focus{outline:2px solid #0077D4;outline-offset:1px;border-color:#0077D4}
.scr-Login .gs-label{display:block;margin-bottom:6px;font:700 14px "Helvetica Neue",Arial,sans-serif;color:#0A2245}
.scr-Login .gs-go{display:flex;align-items:center;justify-content:center;min-height:50px;border-radius:12px;background:#0A2245;color:#FFFFFF;font:700 16px "Helvetica Neue",Arial,sans-serif;text-decoration:none}
.scr-Login .gs-go:hover{background:#0077D4;color:#FFFFFF}
.scr-Login a:focus-visible,.scr-Login input:focus-visible{outline:3px solid #92C9EB;outline-offset:2px}
.scr-Main{margin:0;background:#F4F6F9;color:#0A2245;font-family:Georgia,"Times New Roman",serif}
.scr-Main a{color:#0077D4}
.scr-Main a:hover{color:#0A2245}
.scr-Main .gs-input{box-sizing:border-box;width:100%;min-height:44px;padding:10px 12px;border:1px solid #9AA6B5;border-radius:12px;font:15px Georgia,serif;color:#0A2245;background:#fff}
.scr-Main .gs-input:focus{outline:2px solid #0077D4;outline-offset:1px;border-color:#0077D4}
.scr-Main .gs-label{display:block;margin-bottom:6px;font:700 14px "Helvetica Neue",Arial,sans-serif;color:#0A2245}
.scr-Main .gs-btn{min-height:44px;padding:0 20px;border:none;border-radius:12px;background:#0A2245;color:#fff;font:700 15px "Helvetica Neue",Arial,sans-serif;cursor:pointer}
.scr-Main .gs-btn:hover{background:#0077D4}
.scr-Main .gs-btn2{min-height:44px;padding:0 20px;border:1px solid #0A2245;border-radius:12px;background:#fff;color:#0A2245;font:700 15px "Helvetica Neue",Arial,sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.scr-Main .gs-btn2:hover{background:#F5EBDC;color:#0A2245}
.scr-Main button:focus-visible,.scr-Main a:focus-visible,.scr-Main input:focus-visible{outline:3px solid #92C9EB;outline-offset:2px}
.scr-Main .gs-card{background:#fff;border:1px solid #DDE3EA;border-radius:12px}
.scr-Main .gs-chip{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:12px;font:700 12px "Helvetica Neue",Arial,sans-serif;letter-spacing:.2px;white-space:nowrap}
.scr-Main .gs-muted{color:#4A5A70}
.scr-Main .gs-h2{margin:0;font:700 22px "Helvetica Neue",Arial,sans-serif;color:#0A2245}
.scr-Main .gs-h3{margin:0;font:700 18px/1.3 "Helvetica Neue",Arial,sans-serif;color:#0A2245}
.scr-Main table{border-collapse:collapse;width:100%}
.scr-Main th{text-align:left;font:700 13px "Helvetica Neue",Arial,sans-serif;color:#4A5A70;padding:12px 16px;border-bottom:1px solid #DDE3EA;white-space:nowrap}
.scr-Main td{padding:14px 16px;border-bottom:1px solid #EEF1F5;font-size:15px;vertical-align:middle}
.scr-CrearCurso{margin:0;background:#F4F6F9;color:#0A2245;font-family:Georgia,"Times New Roman",serif}
.scr-CrearCurso a{color:#0077D4}
.scr-CrearCurso a:hover{color:#0A2245}
.scr-CrearCurso .gs-input{box-sizing:border-box;width:100%;min-height:44px;padding:10px 12px;border:1px solid #9AA6B5;border-radius:12px;font:15px Georgia,serif;color:#0A2245;background:#fff}
.scr-CrearCurso .gs-input:focus{outline:2px solid #0077D4;outline-offset:1px;border-color:#0077D4}
.scr-CrearCurso .gs-label{display:block;margin-bottom:6px;font:700 14px "Helvetica Neue",Arial,sans-serif;color:#0A2245}
.scr-CrearCurso .gs-btn{min-height:44px;padding:0 20px;border:none;border-radius:12px;background:#0A2245;color:#fff;font:700 15px "Helvetica Neue",Arial,sans-serif;cursor:pointer}
.scr-CrearCurso .gs-btn:hover{background:#0077D4}
.scr-CrearCurso .gs-btn2{min-height:44px;padding:0 18px;border:1px solid #0A2245;border-radius:12px;background:#fff;color:#0A2245;font:700 15px "Helvetica Neue",Arial,sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.scr-CrearCurso .gs-btn2:hover{background:#F5EBDC;color:#0A2245}
.scr-CrearCurso .gs-btn2:disabled{opacity:.35;cursor:default;background:#fff}
.scr-CrearCurso .gs-icon{width:38px;height:38px;min-height:38px;padding:0;border:1px solid #9AA6B5;border-radius:12px;background:#fff;color:#0A2245;font:700 15px "Helvetica Neue",Arial,sans-serif;cursor:pointer}
.scr-CrearCurso .gs-icon:hover{background:#F5EBDC}
.scr-CrearCurso .gs-icon:disabled{opacity:.3;cursor:default;background:#fff}
.scr-CrearCurso button:focus-visible,.scr-CrearCurso a:focus-visible,.scr-CrearCurso input:focus-visible{outline:3px solid #92C9EB;outline-offset:2px}
.scr-CrearCurso .gs-card{background:#fff;border:1px solid #DDE3EA;border-radius:12px}
.scr-CrearCurso .gs-chip{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:12px;font:700 12px "Helvetica Neue",Arial,sans-serif;letter-spacing:.2px;white-space:nowrap}
.scr-CrearCurso .gs-muted{color:#4A5A70}
.scr-CrearCurso .gs-h2{margin:0;font:700 22px "Helvetica Neue",Arial,sans-serif;color:#0A2245}
.scr-CrearCurso .gs-h3{margin:0;font:700 17px/1.3 "Helvetica Neue",Arial,sans-serif;color:#0A2245}
.scr-Curso{margin:0;background:#F4F6F9;color:#0A2245;font-family:Georgia,"Times New Roman",serif}
.scr-Curso a{color:#0077D4}
.scr-Curso a:hover{color:#0A2245}
.scr-Curso .gs-input{box-sizing:border-box;width:100%;min-height:44px;padding:10px 12px;border:1px solid #9AA6B5;border-radius:12px;font:15px Georgia,serif;color:#0A2245;background:#fff}
.scr-Curso .gs-label{display:block;margin-bottom:6px;font:700 14px "Helvetica Neue",Arial,sans-serif;color:#0A2245}
.scr-Curso .gs-btn{min-height:46px;padding:0 22px;border:none;border-radius:12px;background:#0A2245;color:#fff;font:700 15px "Helvetica Neue",Arial,sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.scr-Curso .gs-btn:hover{background:#0077D4;color:#fff}
.scr-Curso .gs-btn:disabled{background:#B2B3B5;color:#0A2245;cursor:default}
.scr-Curso .gs-btn2{min-height:46px;padding:0 20px;border:1px solid #0A2245;border-radius:12px;background:#fff;color:#0A2245;font:700 15px "Helvetica Neue",Arial,sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.scr-Curso .gs-btn2:hover{background:#F5EBDC;color:#0A2245}
.scr-Curso button:focus-visible,.scr-Curso a:focus-visible,.scr-Curso input:focus-visible{outline:3px solid #92C9EB;outline-offset:2px}
.scr-Curso .gs-card{background:#fff;border:1px solid #DDE3EA;border-radius:12px}
.scr-Curso .gs-chip{display:inline-flex;align-items:center;min-height:24px;padding:0 9px;border-radius:12px;font:700 12px "Helvetica Neue",Arial,sans-serif;white-space:nowrap}
.scr-Curso .gs-muted{color:#4A5A70}
.scr-Curso .gs-h2{margin:0;font:700 24px "Helvetica Neue",Arial,sans-serif;color:#0A2245}
</style>
</head>
<body>
<div class="pv"><div class="pv-in"><span class="pv-t">Mockup Grey Skills</span><nav class="pv-tabs" aria-label="Pantallas del mockup"><button class="pv-tab" data-go="Login">Ingreso</button><button class="pv-tab" data-go="Main">Plataforma</button><button class="pv-tab" data-go="CrearCurso">Crear curso</button><button class="pv-tab" data-go="Curso">Curso por dentro</button></nav></div></div>
<div id="root"></div>
<template id="tpl-Login">

<div style="min-height: 100vh; display: flex; flex-wrap: wrap">
<div style="flex: 1 1 420px; background: #0A2245; color: #FFFFFF; padding: 56px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 48px">
<div style="display: flex; align-items: baseline; gap: 10px">
<span style="font-family: Georgia, serif; font-size: 26px">Grey Skills</span>
<span style="font: 700 11px 'Helvetica Neue', Arial, sans-serif; color: #92C9EB; letter-spacing: 1.5px; text-transform: uppercase">Greystar Chile</span>
</div>
<div style="max-width: 460px">
<h1 style="margin: 0 0 16px; font: 700 44px/1.1 'Helvetica Neue', Arial, sans-serif">Aprende algo nuevo para tu día a día.</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.55; color: #C9D3E0">Tus cursos, los que te asignaron y los que eliges tú, en un solo lugar.</p>
</div>
<div style="height: 6px; width: 120px; background: #92C9EB; border-radius: 12px"></div>
</div>
<div style="flex: 1 1 420px; padding: 56px 24px; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
<div style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 20px">
<h2 style="margin: 0; font: 700 28px 'Helvetica Neue', Arial, sans-serif">Ingresa</h2>
<div><label class="gs-label" for="rut">RUT</label><input id="rut" class="gs-input" placeholder="12.345.678-9" autocomplete="username"></div>
<div><label class="gs-label" for="pw">Contraseña</label><input id="pw" class="gs-input" type="password" autocomplete="current-password"></div>
<a class="gs-go" href="Main.dc.html">Ingresar</a>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #4A5A70">¿Olvidaste tu contraseña? Escríbele a Josefina y te asigna una nueva.</p>
</div>
</div>
</div>
</template>
<template id="tpl-Main">

<div style="min-height: 100%; display: flex; flex-direction: column">
<div style="background: #F5EBDC; border-bottom: 1px solid #E2D6C4">
<div style="max-width: 1200px; margin: 0 auto; padding: 8px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="font: 700 13px 'Helvetica Neue', Arial, sans-serif; color: #0A2245; margin-right: 6px">Ver el mockup como:</span>
<sc-for list="{{rolesDemo}}" as="r" hint-placeholder-count="5">
<button onClick="{{r.go}}" aria-pressed="{{r.on}}" style="min-height: 36px; padding: 0 14px; border-radius: 12px; border: 1px solid {{r.bd}}; background: {{r.bg}}; color: {{r.fg}}; font: 700 13px 'Helvetica Neue', Arial, sans-serif; cursor: pointer">{{r.l}}</button>
</sc-for>
</div>
</div>

<header style="background: #0A2245">
<div style="max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 32px; min-height: 68px">
<div style="display: flex; align-items: baseline; gap: 10px">
<span style="font-family: Georgia, serif; font-size: 24px; color: #FFFFFF; letter-spacing: 0.3px">Grey Skills</span>
<span style="font: 700 11px 'Helvetica Neue', Arial, sans-serif; color: #92C9EB; letter-spacing: 1.5px; text-transform: uppercase">Greystar Chile</span>
</div>
<nav aria-label="Secciones" style="display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button onClick="{{t.go}}" aria-current="{{t.current}}" style="background: none; border: none; border-bottom: 3px solid {{t.border}}; padding: 22px 12px 19px; font: {{t.weight}} 15px 'Helvetica Neue', Arial, sans-serif; color: {{t.color}}; cursor: pointer">{{t.label}}</button>
</sc-for>
</nav>
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 40px; height: 40px; border-radius: 12px; background: #92C9EB; color: #0A2245; display: flex; align-items: center; justify-content: center; font: 700 14px 'Helvetica Neue', Arial, sans-serif">{{p.ini}}</span>
<span style="display: flex; flex-direction: column; font-family: 'Helvetica Neue', Arial, sans-serif">
<span style="font-size: 14px; font-weight: 700; color: #FFFFFF">{{p.nombre}}</span>
<span style="font-size: 12px; color: #C9D3E0">{{p.cargo}} · {{p.unidad}}</span>
</span>
</div>
</div>
</header>
<sc-if value="{{viendoComo}}" hint-placeholder-val="{{ false }}">
<div style="background: #FFD972; color: #0A2245">
<div style="max-width: 1200px; margin: 0 auto; padding: 10px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px">
<span style="font: 700 14px 'Helvetica Neue', Arial, sans-serif">Estás viendo Grey Skills como {{viewAsName}} ({{viewAsRol}}). Modo solo lectura: nada de lo que hagas se guarda.</span>
<button class="gs-btn" onClick="{{salirVerComo}}" style="min-height: 38px; font-size: 14px">Volver a mi vista</button>
</div>
</div>
</sc-if>

<main style="flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding: 36px 24px 72px; box-sizing: border-box">

<sc-if value="{{isCursos}}" hint-placeholder-val="{{ true }}">
<section style="display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div>
<h1 style="margin: 0 0 6px; font: 700 32px 'Helvetica Neue', Arial, sans-serif">Hola, {{p.first}}</h1>
<p class="gs-muted" style="margin: 0; font-size: 17px">Esto es lo que tienes pendiente.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<span class="gs-chip" style="background: #FFFFFF; color: #0A2245; border: 1px solid #DDE3EA; min-height: 36px; padding: 0 14px; font-size: 13px">{{res.curso}} en curso</span>
<span class="gs-chip" style="background: #FFD972; color: #0A2245; min-height: 36px; padding: 0 14px; font-size: 13px">{{res.vencer}} por vencer</span>
<span class="gs-chip" style="background: #9E3B2E; color: #FFFFFF; min-height: 36px; padding: 0 14px; font-size: 13px">{{res.vencidos}} vencido</span>
</div>
</div>

<div class="gs-card" style="padding: 24px 26px; display: flex; flex-wrap: wrap; align-items: center; gap: 20px 32px">
<div style="display: flex; flex-direction: column; gap: 2px; flex: 0 0 auto">
<span style="font: 700 48px/1 'Helvetica Neue', Arial, sans-serif; color: #0A2245">{{asig.pw}}</span>
<span class="gs-muted" style="font: 700 13px 'Helvetica Neue', Arial, sans-serif">avance de tus cursos asignados</span>
</div>
<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 10px">
<div style="height: 14px; background: #E3E8EF; border-radius: 12px; overflow: hidden"><div style="height: 100%; width: {{asig.pw}}; background: #0077D4"></div></div>
<span class="gs-muted" style="font-size: 15px">{{asig.txt}}</span>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<h2 class="gs-h2">Asignados por tu jefatura</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px">
<sc-for list="{{asignados}}" as="c" hint-placeholder-count="3">
<article class="gs-card" style="overflow: hidden; display: flex; flex-direction: column">
<div style="height: 84px; background: {{c.thumb}}; display: flex; align-items: flex-end; padding: 16px; box-sizing: border-box">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21a2 2 0 0 1 2-2h13v2H6"></path><path d="M9 7h6"></path></svg>
</div>
<div style="padding: 20px; display: flex; flex-direction: column; gap: 12px; flex: 1">
<span class="gs-chip" style="align-self: flex-start; background: {{c.sem.bg}}; color: {{c.sem.fg}}">{{c.sem.l}}</span>
<h3 class="gs-h3">{{c.t}}</h3>
<p class="gs-muted" style="margin: 0; font-size: 14px">{{c.meta}} · {{c.plazo}}</p>
<div style="display: flex; align-items: center; gap: 10px; margin-top: auto">
<div style="flex: 1; height: 8px; background: #E3E8EF; border-radius: 12px; overflow: hidden"><div style="height: 100%; width: {{c.pw}}; background: #0077D4"></div></div>
<span style="font: 700 13px 'Helvetica Neue', Arial, sans-serif">{{c.pw}}</span>
</div>
<a class="gs-btn" href="Curso.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; text-decoration: none; color: #FFFFFF">{{c.cta}}</a>
</div>
</article>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 14px">
<h2 class="gs-h2">Inscritos por ti</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px">
<sc-for list="{{inscritos}}" as="c" hint-placeholder-count="1">
<article class="gs-card" style="overflow: hidden; display: flex; flex-direction: column">
<div style="height: 84px; background: {{c.thumb}}; display: flex; align-items: flex-end; padding: 16px; box-sizing: border-box">
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="{{c.ink}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"></path><path d="M4 21a2 2 0 0 1 2-2h13v2H6"></path><path d="M9 7h6"></path></svg>
</div>
<div style="padding: 20px; display: flex; flex-direction: column; gap: 12px; flex: 1">
<span class="gs-chip" style="align-self: flex-start; background: {{c.sem.bg}}; color: {{c.sem.fg}}">{{c.sem.l}}</span>
<h3 class="gs-h3">{{c.t}}</h3>
<p class="gs-muted" style="margin: 0; font-size: 14px">{{c.meta}}</p>
<div style="display: flex; align-items: center; gap: 10px; margin-top: auto">
<div style="flex: 1; height: 8px; background: #E3E8EF; border-radius: 12px; overflow: hidden"><div style="height: 100%; width: {{c.pw}}; background: #0077D4"></div></div>
<span style="font: 700 13px 'Helvetica Neue', Arial, sans-serif">{{c.pw}}</span>
</div>
<a class="gs-btn" href="Curso.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; text-decoration: none; color: #FFFFFF">{{c.cta}}</a>
</div>
</article>
</sc-for>
<button onClick="{{goExplorar}}" style="min-height: 220px; border: 2px dashed #9AA6B5; border-radius: 12px; background: transparent; color: #0A2245; font: 700 15px 'Helvetica Neue', Arial, sans-serif; cursor: pointer">Buscar más cursos en el explorador</button>
</div>
</div>
</section>
</sc-if>

<sc-if value="{{isExplorar}}" hint-placeholder-val="{{ false }}">
<section style="display: flex; flex-direction: column; gap: 24px">
<div>
<h1 style="margin: 0 0 6px; font: 700 32px 'Helvetica Neue', Arial, sans-serif">Explorador de cursos</h1>
<p class="gs-muted" style="margin: 0; font-size: 17px">Cursos abiertos para todos y los que corresponden a tu cargo. Te inscribes cuando quieras.</p>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 12px; align-items: center">
<div style="flex: 1 1 320px">
<label class="gs-label" for="buscar" style="position: absolute; left: -9999px">Buscar curso</label>
<input id="buscar" class="gs-input" type="search" placeholder="Buscar por nombre o tema">
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{cats}}" as="k" hint-placeholder-count="5">
<button onClick="{{k.go}}" aria-pressed="{{k.on}}" style="min-height: 40px; padding: 0 14px; border-radius: 12px; border: 1px solid {{k.bd}}; background: {{k.bg}}; color: {{k.fg}}; font: 700 14px 'Helvetica Neue', Arial, sans-serif; cursor: pointer">{{k.l}}</button>
</sc-for>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px">
<sc-for list="{{catalogo}}" as="c" hint-placeholder-count="6">
<article class="gs-card" style="padding: 22px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span class="gs-chip" style="background: {{c.vbg}}; color: #0A2245">{{c.vl}}</span>

<template id="tpl-CrearCurso">

<div style="min-height: 100%; display: flex; flex-direction: column">
<div style="background: #F5EBDC; border-bottom: 1px solid #E2D6C4">
<div style="max-width: 1200px; margin: 0 auto; padding: 8px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="font: 700 13px 'Helvetica Neue', Arial, sans-serif; margin-right: 6px">Ver el mockup como:</span>
<sc-for list="{{demo}}" as="r" hint-placeholder-count="4">
<button onClick="{{r.go}}" aria-pressed="{{r.on}}" style="min-height: 36px; padding: 0 14px; border-radius: 12px; border: 1px solid {{r.bd}}; background: {{r.bg}}; color: {{r.fg}}; font: 700 13px 'Helvetica Neue', Arial, sans-serif; cursor: pointer">{{r.l}}</button>
</sc-for>
</div>
</div>

<header style="background: #0A2245">
<div style="max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; min-height: 68px">
<div style="display: flex; align-items: baseline; gap: 10px">
<span style="font-family: Georgia, serif; font-size: 24px; color: #FFFFFF">Grey Skills</span>
<span style="font: 700 11px 'Helvetica Neue', Arial, sans-serif; color: #92C9EB; letter-spacing: 1.5px; text-transform: uppercase">Greystar Chile</span>
</div>
<div style="display: flex; align-items: center; gap: 16px">
<span style="font: 13px 'Helvetica Neue', Arial, sans-serif; color: #C9D3E0">Borrador guardado automáticamente</span>
<a href="Main.dc.html" style="color: #FFFFFF; font: 700 14px 'Helvetica Neue', Arial, sans-serif">Salir</a>
</div>
</div>
</header>

<main style="flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding: 32px 24px 72px; box-sizing: border-box; display: flex; flex-direction: column; gap: 26px">

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 12px">
<div>
<p class="gs-muted" style="margin: 0 0 4px; font: 700 13px 'Helvetica Neue', Arial, sans-serif; letter-spacing: 1px; text-transform: uppercase">{{rolTexto}}</p>
<h1 style="margin: 0; font: 700 32px 'Helvetica Neue', Arial, sans-serif">{{tituloPagina}}</h1>
</div>
</div>

<nav aria-label="Pasos" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px">
<sc-for list="{{pasos}}" as="p" hint-placeholder-count="4">
<button onClick="{{p.go}}" aria-current="{{p.current}}" style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; border: 2px solid {{p.bd}}; background: #FFFFFF; cursor: pointer; text-align: left; color: #0A2245">
<span style="width: 32px; height: 32px; flex: none; border-radius: 12px; background: {{p.bg}}; color: {{p.fg}}; display: flex; align-items: center; justify-content: center; font: 700 14px 'Helvetica Neue', Arial, sans-serif">{{p.n}}</span>
<span style="font: {{p.w}} 15px 'Helvetica Neue', Arial, sans-serif">{{p.l}}</span>
</button>
</sc-for>
</nav>

<sc-if value="{{p1}}" hint-placeholder-val="{{ true }}">
<div class="gs-card" style="padding: 28px; display: flex; flex-direction: column; gap: 22px">
<h2 class="gs-h2">Datos del curso</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px">
<div><label class="gs-label" for="c-t">Título</label><input id="c-t" class="gs-input" value="{{titulo}}" onChange="{{setTitulo}}"></div>
<div><label class="gs-label" for="c-cat">Categoría</label><select id="c-cat" class="gs-input"><option>Seguridad</option><option>Atención al residente</option><option>Cultura</option><option>Herramientas</option></select></div>
</div>
<div><label class="gs-label" for="c-d">Descripción corta (la ven en el explorador)</label><textarea id="c-d" class="gs-input" rows="2" placeholder="Qué aprenderá la persona y para qué le sirve"></textarea></div>
<fieldset style="border: none; padding: 0; margin: 0">
<legend class="gs-label">Color de portada</legend>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<sc-for list="{{portadas}}" as="c" hint-placeholder-count="4">
<button onClick="{{c.go}}" aria-label="{{c.l}}" aria-pressed="{{c.on}}" style="width: 72px; height: 48px; border-radius: 12px; background: {{c.hex}}; border: 3px solid {{c.bd}}; cursor: pointer"></button>
</sc-for>
</div>
</fieldset>

<h2 class="gs-h2" style="margin-top: 6px">¿Quién lo verá?</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px">
<fieldset style="border: 1px solid #DDE3EA; border-radius: 12px; padding: 18px; margin: 0; display: flex; flex-direction: column; gap: 6px">
<legend class="gs-label" style="padding: 0 6px; margin: 0">¿Para qué edificios?</legend>
<label style="display: flex; align-items: center; gap: 10px; min-height: 40px; font-weight: 700"><input type="checkbox" checked="{{edTodos}}" onChange="{{toggleEdTodos}}" style="width: 20px; height: 20px">Todos los edificios y oficina central</label>
<sc-if value="{{edElegir}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 12px">
<sc-for list="{{edOpciones}}" as="o" hint-placeholder-count="12">
<label style="display: flex; align-items: center; gap: 8px; min-height: 36px; font-size: 15px"><input type="checkbox" checked="{{o.on}}" onChange="{{o.toggle}}" style="width: 18px; height: 18px">{{o.l}}</label>
</sc-for>
</div>
</sc-if>
</fieldset>
<fieldset style="border: 1px solid #DDE3EA; border-radius: 12px; padding: 18px; margin: 0; display: flex; flex-direction: column; gap: 6px">
<legend class="gs-label" style="padding: 0 6px; margin: 0">¿Para qué cargos?</legend>
<label style="display: flex; align-items: center; gap: 10px; min-height: 40px; font-weight: 700"><input type="checkbox" checked="{{cgTodos}}" onChange="{{toggleCgTodos}}" style="width: 20px; height: 20px">Todos los cargos</label>
<sc-if value="{{cgElegir}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column">
<sc-for list="{{cgOpciones}}" as="o" hint-placeholder-count="6">
<label style="display: flex; align-items: center; gap: 8px; min-height: 36px; font-size: 15px"><input type="checkbox" checked="{{o.on}}" onChange="{{o.toggle}}" style="width: 18px; height: 18px">{{o.l}}</label>
</sc-for>
</div>
</sc-if>
</fieldset>
</div>
<div style="background: #F5EBDC; border-radius: 12px; padding: 14px 18px; font-size: 15px">Lo verán en el explorador: <strong>{{alcance}}</strong></div>
</div>
</sc-if>

<sc-if value="{{p2}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div style="flex: 1 1 340px; display: flex; flex-direction: column; gap: 12px">
<h2 class="gs-h2">Módulos ({{nMods}})</h2>
<sc-for list="{{mods}}" as="m" hint-placeholder-count="3">
<div style="background: #FFFFFF; border: 2px solid {{m.bd}}; border-radius: 12px; padding: 12px; display: flex; align-items: center; gap: 10px">
<button onClick="{{m.select}}" style="flex: 1; min-width: 0; text-align: left; background: none; border: none; padding: 4px; cursor: pointer; color: #0A2245; display: flex; flex-direction: column; gap: 6px">
<span style="display: flex; align-items: center; gap: 8px"><span style="font: 700 13px 'Helvetica Neue', Arial, sans-serif; color: #4A5A70">{{m.n}}.</span><span class="gs-chip" style="background: {{m.tbg}}; color: #0A2245">{{m.tl}}</span><span class="gs-muted" style="font: 12px 'Helvetica Neue', Arial, sans-serif">{{m.quizL}}</span></span>
<span style="font: 700 15px 'Helvetica Neue', Arial, sans-serif">{{m.t}}</span>
</button>
<div style="display: flex; gap: 4px">
<button class="gs-icon" onClick="{{m.up}}" disabled="{{m.noUp}}" aria-label="Subir módulo">↑</button>
<button class="gs-icon" onClick="{{m.down}}" disabled="{{m.noDown}}" aria-label="Bajar módulo">↓</button>
<button class="gs-icon" onClick="{{m.del}}" aria-label="Eliminar módulo">×</button>
</div>
</div>
</sc-for>
<div class="gs-card" style="padding: 14px; display: flex; flex-direction: column; gap: 10px">
<span class="gs-label" style="margin: 0">Agregar módulo</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button class="gs-btn2" onClick="{{addVideo}}">+ Video</button>
<button class="gs-btn2" onClick="{{addDoc}}">+ Documento</button>
<button class="gs-btn2" onClick="{{addCheck}}">+ Checklist</button>
<button class="gs-btn2" onClick="{{addPol}}">+ Política</button>
</div>
</div>
</div>

<div style="flex: 999 1 480px; min-width: 0">
<sc-if value="{{noSel}}" hint-placeholder-val="{{ false }}">
<div class="gs-card" style="padding: 40px; text-align: center" ><p class="gs-muted" style="margin: 0; font-size: 16px">Agrega un módulo para empezar a editarlo.</p></div>
</sc-if>
<sc-if value="{{hasSel}}" hint-placeholder-val="{{ true }}">
<div class="gs-card" style="padding: 26px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; gap: 10px"><span class="gs-chip" style="background: {{sel.tbg}}; color: #0A2245">{{sel.tl}}</span><span class="gs-muted" style="font: 13px 'Helvetica Neue', Arial, sans-serif">Módulo {{sel.n}} de {{nMods}}</span></div>
<div><label class="gs-label" for="m-t">Título del módulo</label><input id="m-t" class="gs-input" value="{{sel.t}}" onChange="{{sel.setT}}"></div>

<sc-if value="{{sel.isVideo}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div><label class="gs-label" for="v-url">Enlace del video (YouTube o Google Drive)</label><input id="v-url" class="gs-input" placeholder="https://"></div>
<div style="height: 200px; border-radius: 12px; background: #0A2245; display: flex; align-items: center; justify-content: center; color: #C9D3E0; font: 14px 'Helvetica Neue', Arial, sans-serif">Vista previa del video</div>
<label style="display: flex; align-items: center; gap: 10px; min-height: 36px"><input type="checkbox" checked="{{ true }}" style="width: 20px; height: 20px">Exigir ver el video completo para avanzar</label>
</div>
</sc-if>

<sc-if value="{{sel.isDoc}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div><label class="gs-label" for="d-f">Archivo (PDF)</label><input id="d-f" class="gs-input" type="file"></div>
<div><label class="gs-label" for="d-i">Indicaciones para quien lo lee (opcional)</label><textarea id="d-i" class="gs-input" rows="3"></textarea></div>
<label style="display: flex; align-items: center; gap: 10px; min-height: 36px"><input type="checkbox" checked="{{ true }}" style="width: 20px; height: 20px">Pedir que marque "Lo leí" al terminar</label>
</div>
</sc-if>

<sc-if value="{{sel.isCheck}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 10px">
<span class="gs-label" style="margin: 0">Ítems que la persona debe ir marcando</span>
<sc-for list="{{sel.items}}" as="it" hint-placeholder-count="3">
<div style="display: flex; gap: 8px; align-items: center">
<span style="width: 22px; height: 22px; flex: none; border: 2px solid #9AA6B5; border-radius: 6px"></span>
<label style="position: absolute; left: -9999px" for="{{it.id}}">Ítem {{it.n}}</label>
<input id="{{it.id}}" class="gs-input" value="{{it.v}}" onChange="{{it.set}}">
<button class="gs-icon" onClick="{{it.del}}" aria-label="Eliminar ítem">×</button>
</div>
</sc-for>
<button class="gs-btn2" onClick="{{sel.addItem}}" style="align-self: flex-start; min-height: 40px; font-size: 14px">+ Agregar ítem</button>
</div>
</sc-if>

<sc-if value="{{sel.isPol}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 14px">
<div><label class="gs-label" for="p-txt">Texto de la política</label><textarea id="p-txt" class="gs-input" rows="6" placeholder="Pega aquí el texto o un resumen, y adjunta el documento completo abajo"></textarea></div>
<div><label class="gs-label" for="p-f">Documento completo (opcional)</label><input id="p-f" class="gs-input" type="file"></div>
<label style="display: flex; align-items: center; gap: 10px; min-height: 36px"><input type="checkbox" checked="{{ true }}" style="width: 20px; height: 20px">Pedir aceptación con nombre, RUT y fecha</label>
</div>
</sc-if>

<div style="border-top: 1px solid #DDE3EA; padding-top: 18px; display: flex; flex-direction: column; gap: 14px">
<label style="display: flex; align-items: center; gap: 10px; min-height: 40px; font: 700 15px 'Helvetica Neue', Arial, sans-serif"><input type="checkbox" checked="{{sel.quiz}}" onChange="{{sel.toggleQuiz}}" style="width: 20px; height: 20px">Agregar quiz al final de este módulo</label>
<sc-if value="{{sel.quiz}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 14px">
<sc-for list="{{sel.preguntas}}" as="q" hint-placeholder-count="1">
<div style="border: 1px solid #DDE3EA; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #FAFBFC">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<label class="gs-label" style="margin: 0" for="{{q.id}}">Pregunta {{q.n}}</label>
<button class="gs-icon" onClick="{{q.del}}" aria-label="Eliminar pregunta">×</button>
</div>
<input id="{{q.id}}" class="gs-input" value="{{q.q}}" onChange="{{q.setQ}}" placeholder="Escribe la pregunta">
<span class="gs-muted" style="font: 13px 'Helvetica Neue', Arial, sans-serif">Escribe las alternativas y marca la correcta</span>
<sc-for list="{{q.alts}}" as="a" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 10px">
<input type="radio" name="{{a.name}}" checked="{{a.isOk}}" onChange="{{a.mark}}" aria-label="Marcar alternativa {{a.letra}} como correcta" style="width: 20px; height: 20px; flex: none">
<span style="font: 700 14px 'Helvetica Neue', Arial, sans-serif; width: 16px">{{a.letra}}</span>
<input class="gs-input" value="{{a.a}}" onChange="{{a.set}}" aria-label="Alternativa {{a.letra}}" placeholder="Alternativa">
</div>
</sc-for>
</div>
</sc-for>
<button class="gs-btn2" onClick="{{sel.addPregunta}}" style="align-self: flex-start; min-height: 40px; font-size: 14px">+ Agregar pregunta</button>
</div>
</sc-if>
</div>
</div>
</sc-if>
</div>
</div>
</sc-if>

<sc-if value="{{p3}}" hint-placeholder-val="{{ false }}">
<div class="gs-card" style="padding: 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 28px">
<fieldset style="border: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px">
<legend class="gs-label">Orden de los módulos</legend>
<label style="display: flex; align-items: flex-start; gap: 10px; min-height: 40px"><input type="radio" name="orden" checked="{{ordenSec}}" onChange="{{setSec}}" style="width: 20px; height: 20px; margin-top: 2px"><span><strong style="font-family: 'Helvetica Neue', Arial, sans-serif">Uno tras otro</strong><br><span class="gs-muted" style="font-size: 14px">Se desbloquea el siguiente al terminar el anterior</span></span></label>
<label style="display: flex; align-items: flex-start; gap: 10px; min-height: 40px"><input type="radio" name="orden" checked="{{ordenLibre}}" onChange="{{setLibre}}" style="width: 20px; height: 20px; margin-top: 2px"><span><strong style="font-family: 'Helvetica Neue', Arial, sans-serif">Libre</strong><br><span class="gs-muted" style="font-size: 14px">La persona elige por dónde partir</span></span></label>
</fieldset>
<div style="display: flex; flex-direction: column; gap: 16px">
<div><label class="gs-label" for="cf-n">Nota mínima para aprobar los quiz</label><select id="cf-n" class="gs-input"><option>60 %</option><option selected="{{ true }}">70 %</option><option>80 %</option><option>100 %</option></select></div>
<div><label class="gs-label" for="cf-i">Intentos por quiz</label><select id="cf-i" class="gs-input"><option>Ilimitados</option><option>3 intentos</option><option>1 intento</option></select></div>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<div><label class="gs-label" for="cf-d">Duración estimada</label><input id="cf-d" class="gs-input" placeholder="Ej: 40 min"></div>
<label style="display: flex; align-items: center; gap: 10px; min-height: 40px"><input type="checkbox" checked="{{cert}}" onChange="{{toggleCert}}" style="width: 20px; height: 20px">Entregar certificado al terminar</label>
</div>
</div>
</sc-if>

<sc-if value="{{p4}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 20px">
<sc-if value="{{enviado}}" hint-placeholder-val="{{ false }}">
<div style="background: #007B0C; color: #FFFFFF; border-radius: 12px; padding: 18px 20px; font-size: 16px">{{exito}}</div>
</sc-if>
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<div style="flex: 1 1 320px; display: flex; flex-direction: column; gap: 10px">
<h2 class="gs-h2">Así se verá en el explorador</h2>
<article class="gs-card" style="overflow: hidden">
<div style="height: 96px; background: {{portada}}"></div>
<div style="padding: 20px; display: flex; flex-direction: column; gap: 10px">
<span class="gs-chip" style="align-self: flex-start; background: #92C9EB; color: #0A2245">{{chipPublico}}</span>
<h3 class="gs-h3">{{titulo}}</h3>
<p class="gs-muted" style="margin: 0; font-size: 14px">{{nMods}} módulos · {{nQuiz}} con quiz</p>
<span class="gs-btn" style="display: inline-flex; align-items: center; align-self: flex-start">Inscribirme</span>
</div>
</article>
</div>
<div class="gs-card" style="flex: 999 1 440px; min-width: 0; padding: 24px; display: flex; flex-direction: column; gap: 4px">
<h2 class="gs-h2" style="margin-bottom: 10px">Revisión final</h2>
<sc-for list="{{resumen}}" as="r" hint-placeholder-count="6">
<div style="display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 10px 0; border-bottom: 1px solid #EEF1F5">
<span class="gs-muted" style="flex: 0 0 170px; font: 700 14px 'Helvetica Neue', Arial, sans-serif">{{r.k}}</span>
<span style="flex: 1 1 220px; font-size: 15px">{{r.v}}</span>
</div>
</sc-for>
<sc-if value="{{sinModulos}}" hint-placeholder-val="{{ false }}">
<div style="background: #FFD972; border-radius: 12px; padding: 12px 16px; margin-top: 10px; font-size: 15px">El curso no tiene módulos. Vuelve al paso 2 antes de continuar.</div>
</sc-if>
<sc-if value="{{editando}}" hint-placeholder-val="{{ false }}">
<div style="background: #92C9EB; border-radius: 12px; padding: 14px 16px; margin-top: 14px; font-size: 15px; display: flex; flex-direction: column; gap: 4px"><strong style="font-family: 'Helvetica Neue', Arial, sans-serif">12 personas van a mitad de este curso</strong><span>Al publicar, cada una verá un aviso para elegir si sigue con la versión que empezó o pasa a la nueva. Quienes no lo han empezado reciben directamente la nueva, y quienes ya lo terminaron conservan su certificado.</span></div>
</sc-if>
<p class="gs-muted" style="margin: 14px 0 0; font-size: 14px">{{notaRol}}</p>
</div>
</div>
</div>
</sc-if>

<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; border-top: 1px solid #DDE3EA; padding-top: 20px">
<button class="gs-btn2" onClick="{{prev}}" disabled="{{noPrev}}">Anterior</button>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<button class="gs-btn2">Guardar borrador</button>
<sc-if value="{{noUltimo}}" hint-placeholder-val="{{ true }}">
<button class="gs-btn" onClick="{{next}}">Siguiente</button>
</sc-if>
<sc-if value="{{p4}}" hint-placeholder-val="{{ false }}">
<button class="gs-btn" onClick="{{enviar}}" disabled="{{sinModulos}}">{{accionFinal}}</button>
</sc-if>
</div>
</div>

</main>
</div>
</template>
<template id="tpl-Curso">

<div style="min-height: 100%; display: flex; flex-direction: column">

<header style="background: #0A2245; color: #FFFFFF">
<div style="max-width: 1200px; margin: 0 auto; padding: 18px 24px 22px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px">
<a href="Main.dc.html" style="color: #92C9EB; font: 700 14px 'Helvetica Neue', Arial, sans-serif; text-decoration: none">← Volver a Mis cursos</a>
<span style="font-family: Georgia, serif; font-size: 18px">Grey Skills</span>
</div>
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div>
<h1 style="margin: 0 0 4px; font: 700 30px 'Helvetica Neue', Arial, sans-serif">Protocolo de emergencias</h1>
<span style="font-size: 15px; color: #C9D3E0">Asignado por Andrés Soto · Vence el 30 de octubre</span>
</div>
<div style="flex: 0 1 320px; min-width: 220px; display: flex; flex-direction: column; gap: 6px">
<span style="font: 700 13px 'Helvetica Neue', Arial, sans-serif; color: #C9D3E0">{{avanceTxt}}</span>
<div style="height: 10px; background: rgba(255,255,255,0.18); border-radius: 12px; overflow: hidden"><div style="height: 100%; width: {{avancePct}}; background: #92C9EB"></div></div>
</div>
</div>
</div>
</header>

<main style="flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; padding: 28px 24px 72px; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<sc-if value="{{verPendiente}}" hint-placeholder-val="{{ true }}">
<div style="flex: 1 1 100%; background: #92C9EB; border-radius: 12px; padding: 18px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px">
<div style="flex: 1 1 420px; display: flex; flex-direction: column; gap: 4px">
<strong style="font: 700 17px 'Helvetica Neue', Arial, sans-serif">Este curso se actualizó el 6 de octubre</strong>
<span style="font-size: 15px">Cambió el módulo 2 (Plano de evacuación). Puedes seguir con la versión que empezaste o pasar a la nueva. Lo que ya completaste en módulos que no cambiaron se mantiene.</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button class="gs-btn" onClick="{{verNueva}}">Pasar a la nueva</button>
<button class="gs-btn2" onClick="{{verAnterior}}">Seguir con la que empecé</button>
</div>

var VOID={input:1,br:1,img:1,hr:1,meta:1,link:1};

function renderKids(node,scope,ctx){var out='';for(var c=node.firstChild;c;c=c.nextSibling)out+=renderNode(c,scope,ctx);return out;}
function renderNode(n,scope,ctx){
 if(n.nodeType===3)return esc(interp(n.nodeValue,scope));
 if(n.nodeType!==1)return '';
 var tag=n.tagName.toLowerCase();
 if(tag==='sc-for'){var list=look(whole(n.getAttribute('list'))||'',scope)||[];var as=n.getAttribute('as');var o='';list.forEach(function(it){var s=Object.create(scope);s[as]=it;o+=renderKids(n,s,ctx);});return o;}
 if(tag==='sc-if'){var w=whole(n.getAttribute('value')||'');return look(w||'false',scope)?renderKids(n,scope,ctx):'';}
 if(n.hasAttribute('data-for')){var l2=look(whole(n.getAttribute('data-for'))||'',scope)||[];var as2=n.getAttribute('data-as');var o2='';l2.forEach(function(it){var s=Object.create(scope);s[as2]=it;o2+=renderEl(n,tag,s,ctx);});return o2;}
 return renderEl(n,tag,scope,ctx);
}
function renderEl(n,tag,scope,ctx){
 var attrs='',ctl=false,selVal=null,optVal=null,txtLike=false;
 for(var i=0;i<n.attributes.length;i++){var a=n.attributes[i],name=a.name,val=a.value;
  if(name==='data-for'||name==='data-as'||name.indexOf('hint-')===0)continue;
  var w=whole(val);
  if(name.indexOf('on')===0&&w!==null){var fn=look(w,scope);if(typeof fn==='function')attrs+=' data-h-'+name.slice(2)+'="'+reg(fn)+'"';continue;}
  if(BOOL[name]){var bv=w!==null?look(w,scope):true;if(name==='checked')ctl=true;if(bv)attrs+=' '+name;continue;}
  if(name==='value'){var vv=w!==null?look(w,scope):val;if(tag==='select'){selVal=vv==null?'':String(vv);ctl=true;continue;}if(tag!=='option')ctl=true;else optVal=String(vv);attrs+=' value="'+esc(vv)+'"';continue;}
  attrs+=' '+name+'="'+esc(w!==null?look(w,scope):interp(val,scope))+'"';
 }
 if(tag==='option'&&ctx.selVal!=null){var ov=optVal!=null?optVal:interp(n.textContent,scope).trim();if(ov===ctx.selVal&&attrs.indexOf(' selected')<0)attrs+=' selected';}
 if(ctl)attrs+=' data-ctl="1"';
 if(VOID[tag])return '<'+tag+attrs+'>';
 var kidCtx=selVal!=null?{selVal:selVal}:ctx;
 return '<'+tag+attrs+'>'+renderKids(n,scope,kidCtx)+'</'+tag+'>';
}
function getInst(f){if(!inst[f]){var C=SCREENS[f];inst[f]=new C(Object.assign({},PROPS[f]));}return inst[f];}
function render(){pending=false;handlers=[];var c=getInst(current);var vals=c.renderVals();var tpl=tplDom[current]||(tplDom[current]=document.getElementById('tpl-'+current).content);
 var html='<div id="root" class="scr-'+current+'">'+renderKids(tpl,vals,{})+'</div>';
 morphdom(root,html,{onBeforeElUpdated:function(from,to){
  if(to.getAttribute&&to.getAttribute('data-ctl'))return true;
  var t=from.tagName;
  if(t==='INPUT'){var ty=from.type;if(ty==='checkbox'||ty==='radio'){to.checked=from.checked;if(from.checked)to.setAttribute('checked','');else to.removeAttribute('checked');}else if(ty!=='file'){to.value=from.value;to.setAttribute('value',from.value);}}
  else if(t==='TEXTAREA'){to.value=from.value;to.textContent=from.value;}
  else if(t==='SELECT'){var v=from.value;Array.prototype.forEach.call(to.options,function(o){if(o.value===v)o.setAttribute('selected','');else o.removeAttribute('selected');});}
  return true;}});
 document.querySelectorAll('.pv-tab').forEach(function(b){b.setAttribute('aria-current',b.getAttribute('data-go')===current?'page':'false');});
}
window.scheduleRender=function(){if(!pending){pending=true;Promise.resolve().then(render);}};
function go(f){current=f;render();window.scrollTo(0,0);}
document.querySelectorAll('.pv-tab').forEach(function(b){b.addEventListener('click',function(){go(b.getAttribute('data-go'));});});
function txt(el){if(el.tagName==='TEXTAREA')return true;if(el.tagName!=='INPUT')return false;return ['checkbox','radio','file'].indexOf(el.type)<0;}
function fire(el,kind,e){var id=el.getAttribute('data-h-'+kind);if(id!=null&&handlers[+id])handlers[+id](e);}
root.addEventListener('click',function(e){
 var a=e.target.closest('a');if(a){var h=a.getAttribute('href')||'';if(h==='#'){e.preventDefault();}else if(/\.dc\.html$/.test(h)){e.preventDefault();go(h.replace('.dc.html',''));return;}}
 var el=e.target.closest('[data-h-click]');if(el&&!el.disabled)fire(el,'click',e);
});
root.addEventListener('input',function(e){var el=e.target;if(el.hasAttribute('data-h-change')&&txt(el))fire(el,'change',e);});
root.addEventListener('change',function(e){var el=e.target;if(el.hasAttribute('data-h-change')&&!txt(el))fire(el,'change',e);});
render();
})();
</script>
