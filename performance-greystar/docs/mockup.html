<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Performance Greystar · Mockup</title>
<style>
:root {
  --navy: #0A2245; --ocean: #0077D4; --sky: #92C9EB; --stucco: #F5EBDC;
  --fondo: #F4F6F9; --borde: #DDE3EA; --borde-suave: #EEF1F5; --borde-fuerte: #9AA6B5;
  --gris-barra: #E3E8EF; --texto-suave: #4A5A70; --texto-claro: #C9D3E0;
  --verde: #007B0C; --amarillo: #FFD972; --rojo: #9E3B2E;
  --radio: 12px; --sans: "Helvetica Neue", Arial, sans-serif; --serif: Georgia, "Times New Roman", serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--fondo); color: var(--navy); font: 16px/1.45 var(--serif); }
button { font: inherit; color: inherit; }
a { color: var(--ocean); }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Barra del mockup */
.pv { position: sticky; top: 0; z-index: 50; background: #FFF; border-bottom: 1px solid var(--borde); }
.pv-in { max-width: 1200px; margin: 0 auto; padding: 8px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; }
.pv-t { font: 700 14px var(--sans); margin-right: 6px; }
.pv-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.pv-tab { min-height: 38px; padding: 0 14px; border-radius: var(--radio); border: 1px solid var(--borde-fuerte); background: #FFF; color: var(--navy); font: 700 14px var(--sans); cursor: pointer; }
.pv-tab[aria-current="page"] { background: var(--navy); border-color: var(--navy); color: #FFF; }

/* Encabezado de la plataforma */
.top { background: var(--navy); color: #FFF; }
.top-in { max-width: 1200px; margin: 0 auto; padding: 0 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 28px; }
.brand { display: flex; flex-direction: column; padding: 12px 0; }
.brand-name { font: 24px var(--serif); letter-spacing: .3px; }
.brand-tag { font: 700 11px var(--sans); color: var(--sky); letter-spacing: 1.5px; text-transform: uppercase; }
.nav { display: flex; flex-wrap: wrap; gap: 4px; flex: 1 1 auto; }
.nav span { padding: 22px 12px 19px; border-bottom: 3px solid transparent; font: 15px var(--sans); color: var(--texto-claro); }
.nav span.on { border-bottom-color: var(--sky); color: #FFF; font-weight: 700; }
.me { display: flex; align-items: center; gap: 10px; margin-left: auto; padding: 10px 0; }
.avatar { width: 40px; height: 40px; flex: none; border-radius: var(--radio); background: var(--sky); color: var(--navy); display: flex; align-items: center; justify-content: center; font: 700 14px var(--sans); }
.me-name { font: 700 14px var(--sans); }
.me-role { font: 12px var(--sans); color: var(--texto-claro); }

/* Estructura */
.main { max-width: 1200px; margin: 0 auto; padding: 32px 24px 72px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.stack-lg { display: flex; flex-direction: column; gap: 26px; }
.stack-sm { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.row-between { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.split { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
.split > .side { flex: 1 1 320px; min-width: 0; }
.split > .grow { flex: 999 1 520px; min-width: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.h1 { margin: 0 0 6px; font: 700 32px/1.15 var(--sans); }
.h2 { margin: 0; font: 700 22px/1.25 var(--sans); }
.h3 { margin: 0; font: 700 18px/1.3 var(--sans); }
.eyebrow { margin: 0 0 4px; font: 700 13px var(--sans); letter-spacing: 1px; text-transform: uppercase; color: var(--texto-suave); }
.lead { margin: 0; font-size: 17px; color: var(--texto-suave); }
.muted { color: var(--texto-suave); }
.small { font-size: 14px; }
.xs { font: 13px var(--sans); }
.strong { font-family: var(--sans); font-weight: 700; }
p { margin: 0; }

.card { background: #FFF; border: 1px solid var(--borde); border-radius: var(--radio); }
.pad { padding: 22px 24px; }
.pad-sm { padding: 16px 18px; }
.notice { background: var(--stucco); border-radius: var(--radio); padding: 14px 18px; font-size: 15px; }
.notice-info { background: var(--sky); }
.notice-warn { background: var(--amarillo); }
.kpi { font: 700 34px/1.1 var(--sans); }

.btn, .btn2 { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 20px; border-radius: var(--radio); font: 700 15px var(--sans); cursor: pointer; white-space: nowrap; }
.btn { border: 1px solid var(--navy); background: var(--navy); color: #FFF; }
.btn:hover { background: var(--ocean); border-color: var(--ocean); }
.btn:disabled { opacity: .4; cursor: default; background: var(--navy); border-color: var(--navy); }
.btn2 { border: 1px solid var(--navy); background: #FFF; color: var(--navy); }
.btn2:hover { background: var(--stucco); }
.btn-sm { min-height: 36px; padding: 0 14px; font-size: 14px; }

.chip { display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: var(--radio); font: 700 12px var(--sans); white-space: nowrap; }
.c-ok { background: var(--verde); color: #FFF; }
.c-warn { background: var(--amarillo); color: var(--navy); }
.c-late { background: var(--rojo); color: #FFF; }
.c-done { background: var(--navy); color: #FFF; }
.c-none { background: var(--stucco); color: var(--navy); }
.c-sky { background: var(--sky); color: var(--navy); }
.c-suave { background: var(--gris-barra); color: var(--navy); }
.t90 { background: var(--stucco); color: var(--navy); }
.t180 { background: var(--sky); color: var(--navy); }
.t360 { background: var(--navy); color: #FFF; }

.bar { flex: 1; height: 8px; background: var(--gris-barra); border-radius: var(--radio); overflow: hidden; min-width: 40px; }
.bar > span { display: block; height: 100%; background: var(--ocean); }
.bar-row { display: flex; align-items: center; gap: 10px; }
.bar-pct { font: 700 13px var(--sans); min-width: 44px; text-align: right; }

.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; font: 700 13px var(--sans); color: var(--texto-suave); padding: 12px 14px; border-bottom: 1px solid var(--borde); white-space: nowrap; }
td { padding: 12px 14px; border-bottom: 1px solid var(--borde-suave); font-size: 15px; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
.num { text-align: right; font-family: var(--sans); font-variant-numeric: tabular-nums; }

.label { display: block; margin-bottom: 6px; font: 700 14px var(--sans); }
.input { width: 100%; min-height: 42px; padding: 8px 12px; border: 1px solid var(--borde-fuerte); border-radius: var(--radio); font: 15px var(--serif); color: var(--navy); background: #FFF; }
textarea.input { resize: vertical; }
.input-num { width: 90px; text-align: right; font-family: var(--sans); }
.check { display: flex; align-items: flex-start; gap: 10px; font-size: 15px; cursor: pointer; }
.check input { width: 20px; height: 20px; flex: none; margin-top: 2px; accent-color: var(--navy); }

/* Etapas del ciclo */
.steps { display: grid; grid-template-columns: repeat(7, minmax(110px, 1fr)); gap: 6px; overflow-x: auto; }
.step { padding: 10px 12px; border-radius: var(--radio); background: var(--gris-barra); font: 13px/1.3 var(--sans); min-width: 110px; }
.step b { display: block; font-size: 14px; }
.step.done { background: var(--navy); color: #FFF; }
.step.now { background: var(--ocean); color: #FFF; }

/* Escala de evaluación */
.scale { display: flex; flex-wrap: wrap; gap: 6px; }
.scale button { min-width: 44px; min-height: 44px; padding: 0 10px; border-radius: var(--radio); border: 1px solid var(--borde-fuerte); background: #FFF; font: 700 15px var(--sans); cursor: pointer; }
.scale button:hover { background: var(--stucco); }
.scale button[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #FFF; }
.scale .no { font-weight: 400; font-size: 13px; }
.comp { border-top: 1px solid var(--borde-suave); padding-top: 18px; }
.comp:first-child { border-top: none; padding-top: 0; }
.conducta { font-size: 14px; color: var(--texto-suave); padding-left: 14px; border-left: 3px solid var(--sky); }

/* Comparación por evaluador */
.cmp { display: grid; grid-template-columns: minmax(150px, 1.2fr) 3fr; gap: 6px 16px; align-items: center; }
.cmp-bars { display: flex; flex-direction: column; gap: 4px; }
.cmp-l { display: flex; align-items: center; gap: 8px; font: 12px var(--sans); }
.cmp-l .bar { height: 10px; }
.cmp-l .k { width: 90px; flex: none; color: var(--texto-suave); }
.cmp-l .v { width: 30px; flex: none; text-align: right; font-weight: 700; }
.s-auto > span { background: var(--borde-fuerte); }
.s-jefe > span { background: var(--navy); }
.s-par > span { background: var(--ocean); }
.s-eq > span { background: var(--sky); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font: 13px var(--sans); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* Distribución de calibración */
.dist { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; align-items: end; height: 190px; }
.dist-col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; }
.dist-bar { width: 100%; max-width: 80px; background: var(--ocean); border-radius: 6px 6px 0 0; transition: height .25s; }
.dist-n { font: 700 14px var(--sans); }
.dist-l { font: 12px/1.2 var(--sans); text-align: center; color: var(--texto-suave); min-height: 30px; }
.dist-ref { font: 11px var(--sans); color: var(--texto-suave); }

.big-score { font: 700 56px/1 var(--sans); }
.hidden { display: none !important; }

@media (max-width: 640px) {
  .main { padding: 24px 16px 56px; }
  .pv-in, .top-in { padding-left: 16px; padding-right: 16px; }
  .h1 { font-size: 26px; }
  .nav { display: none; }
  .cmp { grid-template-columns: 1fr; }
  .pad { padding: 18px 16px; }
}
</style>
</head>
<body>

<div class="pv"><div class="pv-in">
  <span class="pv-t">Mockup</span>
  <div class="pv-tabs" role="tablist" id="tabs"></div>
</div></div>

<div id="root"></div>

<script>
// Mockup estático: datos ficticios, nada se guarda.
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ini = (n) => n.split(' ').map((x) => x[0]).slice(0, 2).join('');
const f1 = (n) => n.toFixed(1).replace('.', ',');

const ESCALA = [
  { n: 1, l: 'No cumple' }, { n: 2, l: 'Cumple parcialmente' }, { n: 3, l: 'Cumple' },
  { n: 4, l: 'Supera' }, { n: 5, l: 'Destaca' }
];
const resultado = (x) => x < 2 ? 'No cumple' : x < 2.8 ? 'Cumple parcialmente' : x < 3.7 ? 'Cumple' : x < 4.5 ? 'Supera' : 'Destaca';
const chipTipo = (t) => `<span class="chip t${t}">${t}°</span>`;
const ESTADO = {
  env: '<span class="chip c-ok">Enviada</span>', cur: '<span class="chip c-warn">En curso</span>',
  pen: '<span class="chip c-suave">Pendiente</span>', atr: '<span class="chip c-late">Atrasada</span>',
  na: '<span class="muted xs">No aplica</span>'
};

const ETAPAS = [
  ['Configuración', '1–15 sep'], ['Objetivos', '16 sep–4 oct'], ['Mitad de año', 'omitida'],
  ['Evaluación', '13 oct–7 nov'], ['Calibración', '10–21 nov'], ['Conversación', '24 nov–12 dic'], ['Cierre', '15–19 dic']
];
const etapas = (actual) => `<div class="steps" aria-label="Etapas del ciclo">${ETAPAS.map(([t, d], i) =>
  `<div class="step ${i < actual ? 'done' : i === actual ? 'now' : ''}" ${i === actual ? 'aria-current="step"' : ''}><b>${t}</b>${d}</div>`).join('')}</div>`;

function header(nav, on, nombre, rol) {
  return `<header class="top"><div class="top-in">
    <div class="brand"><span class="brand-name">Performance</span><span class="brand-tag">Greystar</span></div>
    <nav class="nav" aria-label="Secciones">${nav.map((n) => `<span class="${n === on ? 'on' : ''}">${n}</span>`).join('')}</nav>
    <div class="me"><span class="avatar">${ini(nombre)}</span><span><div class="me-name">${nombre}</div><div class="me-role">${rol}</div></span></div>
  </div></header>`;
}
const NAV_T = ['Mi evaluación', 'Mis objetivos', 'Mi historial'];
const NAV_J = ['Mi evaluación', 'Mis objetivos', 'Mi equipo', 'Mi historial'];
const NAV_G = ['Mi evaluación', 'Mis objetivos', 'Mi equipo', 'Calibración', 'Mi historial'];
const NAV_A = ['Administración', 'Ciclos', 'Competencias', 'Calibración', 'Reportes'];

// ---------- Competencias de Guest Service ----------
const COMPS_GS = [
  { id: 'srv', t: 'Servicio al residente', tipo: 'Corporativa', c: ['Saluda y atiende al residente por su nombre.', 'Resuelve o deriva la solicitud el mismo día y avisa cómo quedó.'] },
  { id: 'eq', t: 'Trabajo en equipo', tipo: 'Corporativa', c: ['Comparte información del turno con el equipo.', 'Ofrece ayuda cuando ve a un compañero sobrepasado.'] },
  { id: 'resp', t: 'Responsabilidad', tipo: 'Corporativa', c: ['Llega a la hora y cumple su turno completo.', 'Cumple los procedimientos del edificio sin que se los recuerden.'] },
  { id: 'com', t: 'Comunicación', tipo: 'Corporativa', c: ['Se expresa con claridad y respeto, también por escrito.'] },
  { id: 'reg', t: 'Registro y seguimiento de solicitudes', tipo: 'De cargo', c: ['Registra toda solicitud en el sistema con datos completos.', 'Hace seguimiento hasta el cierre.'] },
  { id: 'emer', t: 'Manejo de contingencias', tipo: 'De cargo', c: ['Aplica el protocolo de emergencias y avisa a quien corresponde.'] }
];

// ================== Pantallas ==================
const S = {};

S.inicio = {
  tab: 'Mi evaluación', render: () => `${header(NAV_T, 'Mi evaluación', 'Camila Rojas', 'Guest Service · Edificio Nativo')}
  <main class="main stack-lg">
    <div class="row-between">
      <div><p class="eyebrow">Evaluación de Desempeño 2026</p><h1 class="h1">Mi evaluación</h1>
        <p class="lead">Tu evaluación es ${chipTipo(180)}: tú te autoevalúas y Andrés Soto, tu jefatura, te evalúa. Después conversan el resultado.</p></div>
    </div>
    ${etapas(3)}
    <div class="split">
      <section class="grow stack">
        <h2 class="h2">Lo que tienes pendiente</h2>
        <div class="card pad row-between" style="align-items:center">
          <div class="stack-sm"><span class="chip c-warn" style="align-self:flex-start">Vence en 16 días · 7 nov</span>
            <h3 class="h3">Autoevaluación</h3>
            <p class="muted small">6 competencias · 4 de 6 respondidas · se guarda sola mientras avanzas.</p>
            <div class="bar-row" style="max-width:320px"><div class="bar"><span style="width:67%"></span></div><span class="bar-pct">67 %</span></div>
          </div>
          <button class="btn" data-go="form">Continuar autoevaluación</button>
        </div>
        <div class="notice notice-info small">Andrés no verá tu autoevaluación hasta enviar la suya. Tu resultado lo vas a ver después de la calibración, cuando lo conversen (24 nov – 12 dic).</div>
        <h2 class="h2" style="margin-top:10px">Mis objetivos 2026</h2>
        <div class="card table-wrap"><table>
          <thead><tr><th>Objetivo</th><th>Indicador y meta</th><th class="num">Peso</th><th>Estado</th></tr></thead>
          <tbody>
            <tr><td class="strong">Resolver solicitudes a tiempo</td><td class="small">Solicitudes cerradas en ≤ 48 h · meta 90 %</td><td class="num">40 %</td><td><span class="chip c-ok">Aceptado</span></td></tr>
            <tr><td class="strong">Satisfacción de residentes</td><td class="small">Encuesta mensual del lobby · meta 4,5 de 5</td><td class="num">35 %</td><td><span class="chip c-ok">Aceptado</span></td></tr>
            <tr><td class="strong">Ruta de Guest Service al día</td><td class="small">Cursos de su ruta en Grey Skills · meta 100 %</td><td class="num">25 %</td><td><span class="chip c-ok">Aceptado</span></td></tr>
          </tbody></table></div>
      </section>
      <aside class="side stack">
        <div class="card pad stack-sm">
          <p class="eyebrow">Cómo se calcula tu nota</p>
          <div class="bar-row"><span class="small" style="width:120px">Competencias</span><div class="bar"><span style="width:70%"></span></div><span class="bar-pct">70 %</span></div>
          <div class="bar-row"><span class="small" style="width:120px">Objetivos</span><div class="bar"><span style="width:30%"></span></div><span class="bar-pct">30 %</span></div>
          <p class="xs muted" style="margin-top:6px">En competencias cuenta la nota de tu jefatura. Tu autoevaluación se muestra al lado para conversar las diferencias.</p>
        </div>
        <div class="card pad stack-sm">
          <p class="eyebrow">Escala</p>
          ${ESCALA.map((e) => `<div class="row small"><span class="chip c-suave" style="min-width:26px;justify-content:center">${e.n}</span>${e.l}</div>`).join('')}
        </div>
      </aside>
    </div>
  </main>`
};

S.form = {
  tab: 'Autoevaluación', render: () => `${header(NAV_T, 'Mi evaluación', 'Camila Rojas', 'Guest Service · Edificio Nativo')}
  <main class="main stack-lg" style="max-width:900px">
    <div><p class="eyebrow">Autoevaluación · 2026</p><h1 class="h1">¿Cómo te fue este año?</h1>
      <p class="lead">Para cada competencia, elige la nota que mejor describe lo que hiciste en el año. Piensa en ejemplos concretos.</p></div>
    <div class="card pad stack-lg" id="comps">
      ${COMPS_GS.map((c, i) => `<fieldset class="comp stack" data-comp="${c.id}">
        <legend class="row" style="margin-bottom:8px"><span class="h3">${i + 1}. ${c.t}</span><span class="chip ${c.tipo === 'Corporativa' ? 'c-none' : 'c-sky'}">${c.tipo}</span></legend>
        <div class="stack-sm">${c.c.map((x) => `<p class="conducta">${x}</p>`).join('')}</div>
        <div class="scale" role="group" aria-label="Nota para ${c.t}">
          ${ESCALA.map((e) => `<button type="button" data-n="${e.n}" aria-pressed="${[3, 4, 4, 3][i] === e.n}" title="${e.l}">${e.n}</button>`).join('')}
          <button type="button" class="no" data-n="0" aria-pressed="false">No observado</button>
        </div>
        <p class="xs muted" data-lbl>${[3, 4, 4, 3][i] ? ESCALA[[3, 4, 4, 3][i] - 1].l : 'Sin responder'}</p>
        <div data-coment class="hidden"><label class="label" for="cm-${c.id}">Cuéntanos un ejemplo concreto (obligatorio para 1 y 5)</label>
          <textarea class="input" id="cm-${c.id}" rows="2"></textarea></div>
      </fieldset>`).join('')}
    </div>
    <div class="card pad stack">
      <label class="label" for="gral">Comentario general (opcional)</label>
      <textarea class="input" id="gral" rows="3" placeholder="Lo que más te enorgullece del año, en qué te gustaría crecer…"></textarea>
    </div>
    <div class="row-between" style="align-items:center">
      <p class="strong" id="prog">4 de 6 respondidas</p>
      <div class="row"><button class="btn2">Guardar y seguir después</button><button class="btn" id="enviar" disabled>Enviar autoevaluación</button></div>
    </div>
  </main>`,
  init() {
    const upd = () => {
      const sets = [...document.querySelectorAll('[data-comp]')];
      let ok = 0;
      sets.forEach((f) => {
        const sel = f.querySelector('[aria-pressed="true"]');
        const n = sel ? +sel.dataset.n : null;
        f.querySelector('[data-lbl]').textContent = n === null ? 'Sin responder' : n === 0 ? 'No observado: no cuenta en el promedio' : ESCALA[n - 1].l;
        const pideCom = n === 1 || n === 5;
        f.querySelector('[data-coment]').classList.toggle('hidden', !pideCom);
        if (n !== null && (!pideCom || f.querySelector('textarea').value.trim())) ok++;
      });
      $('#prog').textContent = `${ok} de ${sets.length} respondidas`;
      $('#enviar').disabled = ok < sets.length;
    };
    $('#comps').addEventListener('click', (e) => {
      const b = e.target.closest('.scale button'); if (!b) return;
      b.parentNode.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      upd();
    });
    $('#comps').addEventListener('input', upd);
    upd();
  }
};

const EQUIPO = [
  { n: 'Francisca Araya', c: 'Building Manager Assistant', t: 180, obj: 'ok', auto: 'env', jefe: 'cur', par: 'na' },
  { n: 'Camila Rojas', c: 'Guest Service', t: 180, obj: 'ok', auto: 'cur', jefe: 'pen', par: 'na' },
  { n: 'Diego Muñoz', c: 'Guest Service', t: 180, obj: 'ok', auto: 'env', jefe: 'env', par: 'na' },
  { n: 'Valentina Pérez', c: 'Aseo', t: 90, obj: 'ok', auto: 'na', jefe: 'env', par: 'na' },
  { n: 'Matías Contreras', c: 'Aseo', t: 90, obj: 'pend', auto: 'na', jefe: 'atr', par: 'na' }
];
S.equipo = {
  tab: 'Mi equipo', render: () => `${header(NAV_J, 'Mi equipo', 'Andrés Soto', 'Jefatura · Edificio Nativo')}

    draw();
  }
};

      </section>
      <section class="grow card table-wrap"><table>
        <thead><tr><th>Persona</th><th>Tipo</th><th class="num">Comp.</th><th class="num">Obj.</th><th class="num">Calculada</th><th>Calibrado</th><th>Justificación</th></tr></thead>

  init() {
    const rows = CAL.map((p) => { const x = p.comp * pesoComp(p.c) + p.obj * (1 - pesoComp(p.c)); return { ...p, calc: x, adj: resultado(x), just: '' }; });
    const ORDEN = ESCALA.map((e) => e.l);
    const draw = () => {
      const fu = $('#fU').value;
      const vis = rows.filter((r) => !fu || r.u === fu);
      $('#cal').innerHTML = vis.map((r) => { const i = rows.indexOf(r); const cambio = r.adj !== resultado(r.calc); return `<tr>
        <td><div class="strong">${r.n}</div><div class="xs muted">${r.c} · ${r.u}</div></td>
        <td>${chipTipo(r.t)}</td><td class="num">${f1(r.comp)}</td><td class="num">${f1(r.obj)}</td>

      const cnt = ORDEN.map((o) => vis.filter((r) => r.adj === o).length);
      const max = Math.max(1, ...cnt);
      $('#dist').innerHTML = cnt.map((c, i) => `<div class="dist-col"><span class="dist-n">${c}</span>
        <div class="dist-bar" style="height:${Math.max(4, (c / max) * 120)}px;${i === 4 ? 'background:var(--navy)' : i < 2 ? 'background:var(--rojo)' : ''}"></div>
        <span class="dist-l">${ORDEN[i]}</span><span class="dist-ref">${vis.length ? Math.round((c / vis.length) * 100) : 0} %</span></div>`).join('');
      const pDest = vis.length ? cnt[4] / vis.length : 0;
      $('#alerta').classList.toggle('hidden', Math.round(pDest * 100) <= 15);
      $('#alerta').textContent = `${Math.round(pDest * 100)} % está en "Destaca", sobre la referencia de 15 %. Revisa si todos cumplen la conducta de ese nivel.`;
    };
    $('#cal').addEventListener('change', (e) => { if (e.target.dataset.i) { rows[e.target.dataset.i].adj = e.target.value; draw(); } });
    $('#cal').addEventListener('input', (e) => { if (e.target.dataset.j) { rows[e.target.dataset.j].just = e.target.value; e.target.style.border = e.target.value ? '' : '2px solid var(--rojo)'; } });
    $('#fU').onchange = draw;
    draw();
  }
};

    const QUIEN = { 90: 'Jefatura', 180: 'Auto + jefatura', 360: 'Auto + jefatura + pares + equipo' };
    const draw = () => {
      $('#conf').innerHTML = CONF.map((r, i) => `<tr>
        <td class="strong">${r.c}</td><td class="small muted">${r.g}</td>
        <td><select class="input" data-i="${i}" data-k="t" aria-label="Tipo para ${r.c}" style="width:auto">${[90, 180, 360].map((t) => `<option value="${t}" ${t === r.t ? 'selected' : ''}>${t}°</option>`).join('')}</select></td>
        <td class="small">${QUIEN[r.t]}</td>
        <td class="num"><input class="input input-num" type="number" min="0" max="100" step="5" value="${r.pc}" data-i="${i}" data-k="pc" aria-label="Peso competencias para ${r.c}"></td>
        <td class="num">${100 - r.pc} %</td><td class="num">${r.n}</td></tr>`).join('');
    };
    $('#conf').addEventListener('change', (e) => { const el = e.target; if (el.dataset.k) { CONF[el.dataset.i][el.dataset.k] = Math.max(0, Math.min(100, +el.value)); draw(); } });
    draw();
  }
};

// ---------- Navegación del mockup ----------
const ORDEN = ['inicio', 'form', 'equipo', 'objetivos', 'calibracion', 'resultado', 'admin'];
function ir(k) {
  $('#root').innerHTML = S[k].render();
  document.querySelectorAll('.pv-tab').forEach((b) => b.setAttribute('aria-current', b.dataset.k === k ? 'page' : 'false'));
  if (S[k].init) S[k].init();
  history.replaceState(null, '', '#' + k);
  window.scrollTo(0, 0);
}
$('#tabs').innerHTML = ORDEN.map((k, i) => `<button class="pv-tab" data-k="${k}">${i + 1}. ${S[k].tab}</button>`).join('');
$('#tabs').onclick = (e) => { const b = e.target.closest('[data-k]'); if (b) ir(b.dataset.k); };
$('#root').addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) ir(b.dataset.go); });
ir(ORDEN.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'inicio');
</script>
</body>
</html>
